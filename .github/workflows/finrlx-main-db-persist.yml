name: Persist FinRL-X main DB

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/finrlx-main-db-persist.yml"

permissions:
  contents: write

jobs:
  persist-main-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy py7zr yfinance

      - name: Validate SEC snapshot
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/sec_companyfacts_latest.csv")
          assert len(df) >= 450, len(df)
          assert {"ticker","latest_fact_end","latest_filed"}.issubset(df.columns)
          assert df["latest_fact_end"].notna().sum() >= 400
          print("SEC rows:", len(df))
          print("latest fact end:", df["latest_fact_end"].max())
          print("latest filed:", df["latest_filed"].max())
          PY

      - name: Persist latest SEC periods into main database
        run: |
          python src/data/finrlx_merge_sec_into_main.py \
            --archive data/finrl_trading.7z \
            --sec data/sec_companyfacts_latest.csv \
            --csv-out data/fundamental_data_full.csv \
            --audit data/main_db_update_audit.json \
            --as-of 2026-10-02

      - name: Validate database advanced beyond 2026-03-31
        run: |
          python - <<'PY'
          import json
          r = json.load(open("data/main_db_update_audit.json"))
          assert r["after_max_datadate"] > "2026-03-31", r
          assert r["rows_added"] > 0, r
          assert r["after_rows"] > r["before_rows"], r
          assert r["rows_after_2026_03_31"] > 0, r
          print(json.dumps(r, indent=2))
          PY

      - name: Commit persistent DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/finrl_trading.7z data/fundamental_data_full.csv
          git add -f data/main_db_update_audit.json
          git commit -m "data: persist latest SEC quarters into main FinRL-X DB"
          git pull --rebase origin master
          git push origin master
